name: cozymusic-player
version: '1.0.2'
summary: CozyMusic
description: |
  CozyMusic — мод десктопного клиента Яндекс Музыки (база 5.119.0, самообновления заблокированы).
  Работа без Плюса, Discord-RPC, скачивание треков, кастомные шрифты.
  Требуется классическое confinement для доступа к сокету Discord IPC.
confinement: classic
grade: stable
base: core22
architectures:
  - build-on: amd64
    run-on: amd64
apps:
  cozymusic-player:
    command: opt/cozymusic/cozymusic
    desktop: meta/gui/cozymusic-player.desktop
