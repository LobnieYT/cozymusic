name: yandex-music-mod
version: '1.0.1'
summary: Cozymusic
description: |
  Мод десктопного клиента Яндекс Музыки (база 5.119.0, самообновления заблокированы).
  Работа без Плюса, Discord-RPC, скачивание треков, кастомные шрифты.
  Требуется классическое confinement для доступа к сокету Discord IPC.
confinement: classic
grade: stable
base: core22
architectures:
  - build-on: amd64
    run-on: amd64
apps:
  yandex-music-mod:
    command: opt/yandex-music-mod/yandex-music-mod
    desktop: meta/gui/yandex-music-mod.desktop
